[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddiv"
version = "0.1.0"
description = "Find concrete behavioral differences between two C programs using AFL++"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ddiv = "ddiv.cli:main"

[tool.setuptools]
packages = ["ddiv"]
package-dir = {ddiv = "ddiv"}

[tool.setuptools.package-data]
ddiv = ["runtime/*.c", "include/*.h", "Dockerfile"]

[tool.pytest.ini_options]
testpaths = ["ddiv/tests"]
